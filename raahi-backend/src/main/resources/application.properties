# ==========================================
# RAAHI - Smart Tourist Safety System Config
# ==========================================
server.port=${PORT:8080}
spring.application.name=raahi-backend

# ==========================================
# 1. SQL DATABASE CONFIGURATION (Spring Data JPA)
# ==========================================
# Primary: PostgreSQL database 'raahi'
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raahi}
spring.datasource.username=${DB_USER:raahi}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# 2. NOSQL MONGODB CONFIGURATION (Spring Data MongoDB)
# ==========================================
# Stores live tourist location history, incident reports, safety reviews, and SOS emergency records
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/raahi_db}
spring.data.mongodb.auto-index-creation=true

# ==========================================
# 3. JWT SECURITY CONFIGURATION
# ==========================================
# In production, specify JWT_SECRET environment variable (min 32 characters / 256 bits)
raahi.jwt.secret=${JWT_SECRET:}
raahi.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# 4. CORS CONFIGURATION
# ==========================================
raahi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5175}

# ==========================================
# 5. H2 FALLBACK CONSOLE
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON serialization
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Logging configuration
logging.level.root=INFO
logging.level.com.raahi=INFO
logging.level.org.springframework.security=INFO

