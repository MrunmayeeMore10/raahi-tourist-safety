# Profile for testing or running without local PostgreSQL
server.port=${PORT:8080}
spring.application.name=raahi-backend

spring.datasource.url=jdbc:h2:mem:raahidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/raahi_test_db}
raahi.jwt.secret=RaahiTouristSafetySuperSecureJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security1234567890
raahi.jwt.expiration-ms=86400000

